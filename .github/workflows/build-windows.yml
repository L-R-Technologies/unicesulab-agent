name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências
        run: uv sync

      - name: Gerar executável
        run: >-
          uv run --with pyinstaller pyinstaller --noconsole --onefile
          --name UnicesulabAgent --add-data "agent/ui/web;agent/ui/web" main.py

      - name: Compactar
        run: Compress-Archive -Path dist\UnicesulabAgent.exe -DestinationPath UnicesulabAgent.zip

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: UnicesulabAgent
          path: UnicesulabAgent.zip

      - name: Anexar à release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: UnicesulabAgent.zip
